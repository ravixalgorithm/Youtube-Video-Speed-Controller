<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gati</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Youtube Video</h1>
    <p>Speed Controller</p>
    <input type="range" min="0.1" max="5.0" step="0.1" value="1.0" id="speedRange">
    <input type="number" id="speedInput" min="0.1" max="5.0" step="0.1" value="1.0">
    <button id="applySpeed">Apply</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
